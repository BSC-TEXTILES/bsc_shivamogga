<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Canonical + hreflang -->
  <link rel="canonical" href="https://bsc-shivamogga.vercel.app/" />
  <link rel="alternate" hreflang="en" href="https://bsc-shivamogga.vercel.app/" />
  <link rel="alternate" hreflang="x-default" href="https://bsc-shivamogga.vercel.app/" />

  <!-- Preload Critical LCP Hero Image (WebP Responsive) -->
  <link rel="preload" as="image" href="/assets/invite-p1-sm.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/assets/invite-p1.webp" type="image/webp" media="(min-width: 769px)" fetchpriority="high" />

  <!-- Google Fonts: async, non-blocking; font-display=swap in URL -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  </noscript>

  <!-- JSON-LD Event Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "BSC Shivamogga Grand Opening",
    "description": "Grand Opening celebration of BSC Shivamogga showroom at Parekh Vinayaka Mall, BH Road, Shivamogga.",
    "startDate": "2026-10-12T10:30:00+05:30",
    "endDate": "2026-10-12T22:00:00+05:30",
    "eventStatus": "https://schema.org/EventScheduled",
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "location": {
      "@type": "Place",
      "name": "Parekh Vinayaka Mall",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "BH Road",
        "addressLocality": "Shivamogga",
        "addressRegion": "Karnataka",
        "addressCountry": "IN"
      }
    },
    "image": [
      "https://bsc-shivamogga.vercel.app/assets/invite-p1.jpg"
    ],
    "organizer": {
      "@type": "Organization",
      "name": "BSC Textiles (B.S. Channabasappa & Sons)",
      "url": "https://bsc-shivamogga.vercel.app/"
    }
  }
  </script>

  <!-- Critical first-paint styles: guarantee FCP before JS/CSS bundles load -->
  <style>
    html { background: #5A0718; overflow-x: clip; }
    body { margin: 0; overflow-x: clip; }
    #root { min-height: 100vh; min-height: 100dvh; }
    .fp {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: #5A0718;
      color: #FFFDF9;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    .fp h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .fp p {
      margin: 0.35rem 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #F5EBDD;
    }
    .fp .fp-gold { color: #D8BE85; font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; }
    .fp .fp-card {
      margin: 1.25rem auto 0;
      width: min(100%, 420px);
      aspect-ratio: 1492 / 1054;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .fp .fp-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <!-- Static shell paints immediately (FCP + LCP image); React replaces it on mount -->
  <div id="root">
    <div class="fp">
      <div>
        <p class="fp-gold">Established 1938 · Five-Generation Legacy</p>
        <h1>BSC Shivamogga</h1>
        <p>Grand Opening Celebration</p>
        <p>Monday, 12 October 2026 · 10:30 AM onwards</p>
        <p>Parekh Vinayaka Mall, BH Road, Shivamogga</p>
        <div class="fp-card">
          <picture>
            <source type="image/webp" media="(max-width: 768px)" srcset="/assets/invite-p1-sm.webp" />
            <source type="image/webp" media="(min-width: 769px)" srcset="/assets/invite-p1.webp" />
            <img
              src="/assets/invite-p1.webp"
              alt="Welcome to the Grand Opening of BSC Shivamogga on Monday, 12 October 2026 at BH Road, Shivamogga"
              width="1492"
              height="1054"
              fetchpriority="high"
              decoding="async"
            />
          </picture>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
